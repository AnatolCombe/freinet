[project]
name = "freinet"
version = "0.1.0"
description = "A personal tutor that governs learning with a deterministic engine: concept maps, FSRS spaced repetition and a printed morning ticket with QR feedback."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "freinet/polices/LICENSE_DEJAVU"]
authors = [{ name = "Marius Dissat", email = "dissatm@gmail.com" }]
requires-python = ">=3.11"
keywords = ["education", "spaced-repetition", "fsrs", "tutor", "thermal-printer", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "fsrs==6.3.2",
    "pillow==12.3.0",
    "pyusb==1.3.1",
    "pyyaml==6.0.3",
    "segno==1.6.6",
    "tzdata==2026.4",
]

[project.urls]
Repository = "https://github.com/AnatolCombe/freinet"
Issues = "https://github.com/AnatolCombe/freinet/issues"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.3",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freinet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["freinet", "tests"]
