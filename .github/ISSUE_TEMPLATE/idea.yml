name: Idea
description: Propose a feature or a change of design.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Freinet has explicit non-goals (see docs/roadmap.md): no LLM judging mastery, no punitive gamification, no content generated at print time, no learning-styles modelling. Ideas that fit these principles are much more likely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What learner or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would change, and where (module, pipeline stage, ticket section)?
    validations:
      required: true
  - type: textarea
    id: principles
    attributes:
      label: Fit with the design principles
      description: Does it keep the ticket printable without an LLM, the review log append-only, and selection reproducible?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
